<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" role="img" aria-label="Apprentissage IA Factory : apprendre, construire, automatiser">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="learnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="300" fill="url(#learnBg)" rx="24" />
  
  <!-- Bookshelf / modules -->
  <rect x="40" y="80" width="80" height="180" fill="url(#learnGrad)" opacity="0.2" stroke="rgba(139,92,246,0.5)" stroke-width="1" rx="8" />
  <rect x="55" y="95" width="50" height="10" fill="rgba(255,255,255,0.3)" rx="5" />
  <rect x="55" y="115" width="50" height="10" fill="rgba(255,255,255,0.2)" rx="5" />
  <rect x="55" y="135" width="50" height="10" fill="rgba(255,255,255,0.2)" rx="5" />
  <rect x="55" y="155" width="50" height="10" fill="rgba(255,255,255,0.2)" rx="5" />
  <text x="80" y="200" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FORMATIONS</text>
  
  <!-- Code / agent builder -->
  <rect x="140" y="80" width="180" height="180" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12" />
  <text x="160" y="110" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">1. Prompts</text>
  <text x="160" y="130" fill="#22d3ee" font-family="monospace" font-size="10">2. Agents n8n</text>
  <text x="160" y="150" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">3. Intégrations</text>
  <text x="160" y="170" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">4. Déploiement</text>
  <text x="160" y="190" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="10">5. Scale</text>
  
  <rect x="160" y="210" width="140" height="30" fill="rgba(34,197,94,0.2)" rx="6" />
  <text x="230" y="229" fill="#22c55e" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BUILDER PRÊT</text>
  
  <!-- Robot / automation icon -->
  <rect x="340" y="80" width="120" height="180" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12" />
  <rect x="370" y="120" width="60" height="50" fill="url(#learnGrad)" opacity="0.3" rx="10" />
  <circle cx="385" cy="138" r="5" fill="#22d3ee" />
  <circle cx="415" cy="138" r="5" fill="#22d3ee" />
  <rect x="380" y="155" width="40" height="6" fill="white" rx="3" />
  <text x="400" y="210" fill="white" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AGENTS</text>
  <text x="400" y="230" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">automatisés</text>
  
  <!-- Connection lines -->
  <path d="M120 170 L140 170" stroke="url(#learnGrad)" stroke-width="2" stroke-dasharray="4 2" />
  <polygon points="140,170 133,166 133,174" fill="url(#learnGrad)" />
  <path d="M320 170 L340 170" stroke="url(#learnGrad)" stroke-width="2" stroke-dasharray="4 2" />
  <polygon points="340,170 333,166 333,174" fill="url(#learnGrad)" />
  
  <!-- Titre -->
  <text x="250" y="45" fill="white" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Apprends, construis, automatise</text>
  <text x="250" y="65" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Une méthode progressive, sans code requis</text>
</svg>

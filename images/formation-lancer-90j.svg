<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Lancer sa formation IA en 90 jours - plan d'accompagnement">
  <defs>
    <linearGradient id="lancerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="lancerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#lancerBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Lancer sa formation IA en 90 jours</text>
  <text x="300" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">6 séances + accompagnement asynchrone pour trouver vos premiers apprenants</text>
  
  <!-- Timeline -->
  <rect x="80" y="120" width="440" height="8" fill="rgba(255,255,255,0.1)" rx="4" />
  <rect x="80" y="120" width="300" height="8" fill="url(#lancerGrad)" rx="4" />
  
  <!-- Mois 1 -->
  <circle cx="100" cy="124" r="20" fill="url(#lancerGrad)" />
  <text x="100" y="130" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">J1</text>
  <text x="100" y="170" fill="white" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Offre & Landing</text>
  <text x="100" y="190" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Séance 1</text>
  
  <!-- Mois 2 -->
  <circle cx="270" cy="124" r="20" fill="url(#lancerGrad)" />
  <text x="270" y="130" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">J30</text>
  <text x="270" y="170" fill="white" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Lancement & Itération</text>
  <text x="270" y="190" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Séances 2-5</text>
  
  <!-- Mois 3 -->
  <circle cx="480" cy="124" r="20" fill="#22c55e" />
  <text x="480" y="130" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">J90</text>
  <text x="480" y="170" fill="white" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Industrialisation</text>
  <text x="480" y="190" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Séance 6</text>
  
  <!-- KPIs -->
  <rect x="50" y="230" width="160" height="110" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.3)" stroke-width="1" rx="12" />
  <text x="130" y="265" fill="#a78bfa" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">20</text>
  <text x="130" y="290" fill="white" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">prospects qualifiés</text>
  <text x="130" y="310" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">en 14 jours</text>
  
  <rect x="220" y="230" width="160" height="110" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.3)" stroke-width="1" rx="12" />
  <text x="300" y="265" fill="#22d3ee" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">1ère</text>
  <text x="300" y="290" fill="white" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">session animée</text>
  <text x="300" y="310" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">avec retours clients</text>
  
  <rect x="390" y="230" width="160" height="110" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.3)" stroke-width="1" rx="12" />
  <text x="470" y="265" fill="#4ade80" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle">6 mois</text>
  <text x="470" y="290" fill="white" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">de plan croissance</text>
  <text x="470" y="310" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">KPIs + ressources</text>
</svg>

<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Processus en 3 étapes pour déployer un agent IA avec IA Factory">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120d1f" />
      <stop offset="100%" stop-color="#0a0a0f" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGrad2)" rx="24" />
  
  <!-- Étape 1 -->
  <circle cx="100" cy="200" r="60" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="2" />
  <circle cx="100" cy="200" r="45" fill="rgba(139,92,246,0.2)" />
  <text x="100" y="210" fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">01</text>
  <text x="100" y="285" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600" text-anchor="middle">On choisit</text>
  <text x="100" y="305" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">L'agent qui vous</text>
  <text x="100" y="320" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">correspond</text>
  
  <!-- Flèche 1 -->
  <path d="M170 200 L230 200" fill="none" stroke="url(#stepGrad)" stroke-width="3" stroke-linecap="round" />
  <polygon points="230,200 220,194 220,206" fill="url(#stepGrad)" />
  
  <!-- Étape 2 -->
  <circle cx="300" cy="200" r="60" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="2" />
  <circle cx="300" cy="200" r="45" fill="rgba(6,182,212,0.2)" />
  <text x="300" y="210" fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">02</text>
  <text x="300" y="285" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600" text-anchor="middle">On paramètre</text>
  <text x="300" y="305" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Avec vos données,</text>
  <text x="300" y="320" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">votre ton, vos règles</text>
  
  <!-- Flèche 2 -->
  <path d="M370 200 L430 200" fill="none" stroke="url(#stepGrad)" stroke-width="3" stroke-linecap="round" />
  <polygon points="430,200 420,194 420,206" fill="url(#stepGrad)" />
  
  <!-- Étape 3 -->
  <circle cx="500" cy="200" r="60" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="2" />
  <circle cx="500" cy="200" r="45" fill="rgba(34,197,94,0.2)" />
  <text x="500" y="210" fill="white" font-family="Inter, sans-serif" font-size="32" font-weight="700" text-anchor="middle">03</text>
  <text x="500" y="285" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600" text-anchor="middle">On déploie</text>
  <text x="500" y="305" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">L'agent travaille</text>
  <text x="500" y="320" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">automatiquement</text>
  
  <!-- Titre -->
  <text x="300" y="70" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Comment ça marche</text>
  <text x="300" y="100" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">De l'idée à l'agent opérationnel en quelques heures</text>
  
  <!-- Icônes au-dessus -->
  <text x="100" y="145" fill="#a78bfa" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🎯</text>
  <text x="300" y="145" fill="#22d3ee" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">⚙️</text>
  <text x="500" y="145" fill="#4ade80" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🚀</text>
</svg>

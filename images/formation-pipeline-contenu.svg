<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Pipeline de contenu IA - flux de production automatisé">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#pipeBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Pipeline de contenu IA</text>
  <text x="300" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">D'une idée à 5 posts LinkedIn prêts à publier</text>
  
  <!-- Étape 1 -->
  <rect x="40" y="120" width="100" height="130" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.4)" stroke-width="2" rx="12" />
  <text x="90" y="155" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Idée</text>
  <text x="90" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Brief ou</text>
  <text x="90" y="195" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">sujet du jour</text>
  <text x="90" y="230" fill="#a78bfa" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">💡</text>
  
  <!-- Étape 2 -->
  <rect x="170" y="120" width="100" height="130" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.4)" stroke-width="2" rx="12" />
  <text x="220" y="155" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Rédaction</text>
  <text x="220" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Agent IA génère</text>
  <text x="220" y="195" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">5 variations</text>
  <text x="220" y="230" fill="#22d3ee" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">✍️</text>
  
  <!-- Étape 3 -->
  <rect x="300" y="120" width="100" height="130" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="12" />
  <text x="350" y="155" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Validation</text>
  <text x="350" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Revue +</text>
  <text x="350" y="195" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">ajustements</text>
  <text x="350" y="230" fill="#4ade80" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">✅</text>
  
  <!-- Étape 4 -->
  <rect x="430" y="120" width="130" height="130" fill="rgba(255,255,255,0.04)" stroke="rgba(236,72,153,0.4)" stroke-width="2" rx="12" />
  <text x="495" y="155" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Publication</text>
  <text x="495" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Programmation</text>
  <text x="495" y="195" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">LinkedIn auto</text>
  <text x="495" y="230" fill="#ec4899" font-family="Inter, sans-serif" font-size="22" text-anchor="middle">🚀</text>
  
  <!-- Flèches -->
  <path d="M140 185 L170 185" stroke="url(#pipeGrad)" stroke-width="3" stroke-linecap="round" />
  <polygon points="170,185 162,179 162,191" fill="url(#pipeGrad)" />
  <path d="M270 185 L300 185" stroke="url(#pipeGrad)" stroke-width="3" stroke-linecap="round" />
  <polygon points="300,185 292,179 292,191" fill="url(#pipeGrad)" />
  <path d="M400 185 L430 185" stroke="url(#pipeGrad)" stroke-width="3" stroke-linecap="round" />
  <polygon points="430,185 422,179 422,191" fill="url(#pipeGrad)" />
  
  <!-- Résultat -->
  <rect x="100" y="290" width="400" height="70" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1" rx="12" />
  <text x="300" y="318" fill="#4ade80" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Résultat : 1 heure de travail → 1 mois de contenu programmé</text>
  <text x="300" y="342" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Sans perdre votre voix. Sans sounding like a robot.</text>
</svg>

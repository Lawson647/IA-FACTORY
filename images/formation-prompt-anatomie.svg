<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Maîtrise des prompts - structure d'un prompt efficace">
  <defs>
    <linearGradient id="promptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#promptBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Anatomie d'un prompt efficace</text>
  
  <!-- Prompt box -->
  <rect x="80" y="80" width="440" height="260" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
  
  <!-- Section 1: Rôle -->
  <rect x="100" y="100" width="400" height="50" fill="url(#promptGrad)" opacity="0.2" rx="8" />
  <text x="120" y="120" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="600">1. RÔLE</text>
  <text x="120" y="138" fill="white" font-family="Inter, sans-serif" font-size="13">Tu es un expert en marketing B2B...</text>
  
  <!-- Section 2: Tâche -->
  <rect x="100" y="160" width="400" height="50" fill="rgba(6,182,212,0.15)" rx="8" />
  <text x="120" y="180" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600">2. TÂCHE</text>
  <text x="120" y="198" fill="white" font-family="Inter, sans-serif" font-size="13">Rédige 5 posts LinkedIn sur le sujet...</text>
  
  <!-- Section 3: Contexte -->
  <rect x="100" y="220" width="400" height="50" fill="rgba(34,197,94,0.15)" rx="8" />
  <text x="120" y="240" fill="#4ade80" font-family="Inter, sans-serif" font-size="11" font-weight="600">3. CONTEXTE</text>
  <text x="120" y="258" fill="white" font-family="Inter, sans-serif" font-size="13">Mon audience : indépendants, 30-45 ans...</text>
  
  <!-- Section 4: Format -->
  <rect x="100" y="280" width="400" height="40" fill="rgba(236,72,153,0.15)" rx="8" />
  <text x="120" y="298" fill="#ec4899" font-family="Inter, sans-serif" font-size="11" font-weight="600">4. FORMAT</text>
  <text x="200" y="298" fill="white" font-family="Inter, sans-serif" font-size="13">Accroche → développement → CTA. Ton direct.</text>
  
  <!-- Curseur clignotant -->
  <rect x="505" y="298" width="3" height="14" fill="#22d3ee" />
</svg>

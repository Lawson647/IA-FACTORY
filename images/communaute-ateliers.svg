<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-label="Communauté IA Factory - Ateliers, échanges et projets concrets">
  <defs>
    <linearGradient id="commBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="700" height="400" fill="url(#commBg)" rx="24" />
  
  <text x="350" y="45" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">La communauté des Ateliers IA</text>
  <text x="350" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Apprendre ensemble, construire en public, se challenger chaque semaine</text>
  
  <!-- Main screen -->
  <rect x="200" y="110" width="300" height="220" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="20" />
  <rect x="220" y="135" width="260" height="40" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="240" y="160" fill="white" font-family="Inter, sans-serif" font-size="12">Atelier #12 : Créer son 1er agent n8n</text>
  <rect x="220" y="185" width="260" height="40" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="240" y="210" fill="white" font-family="Inter, sans-serif" font-size="12">Projet du mois : Agent support client</text>
  <rect x="220" y="235" width="260" height="40" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="240" y="260" fill="white" font-family="Inter, sans-serif" font-size="12">Challenge : 5 prompts en 30 minutes</text>
  
  <!-- Left avatars -->
  <circle cx="120" cy="180" r="30" fill="url(#commGrad)" opacity="0.3" />
  <text x="120" y="190" fill="white" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">👤</text>
  <circle cx="120" cy="250" r="25" fill="url(#commGrad)" opacity="0.2" />
  <text x="120" y="258" fill="white" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">👤</text>
  
  <!-- Right avatars -->
  <circle cx="580" cy="180" r="25" fill="url(#commGrad)" opacity="0.2" />
  <text x="580" y="188" fill="white" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">👤</text>
  <circle cx="580" cy="250" r="30" fill="url(#commGrad)" opacity="0.3" />
  <text x="580" y="260" fill="white" font-family="Inter, sans-serif" font-size="18" text-anchor="middle">👤</text>
  
  <!-- Connection lines -->
  <path d="M150 180 L200 155" stroke="url(#commGrad)" stroke-width="2" opacity="0.5" />
  <path d="M150 250 L200 205" stroke="url(#commGrad)" stroke-width="2" opacity="0.5" />
  <path d="M500 175 L555 180" stroke="url(#commGrad)" stroke-width="2" opacity="0.5" />
  <path d="M500 220 L555 250" stroke="url(#commGrad)" stroke-width="2" opacity="0.5" />
  
  <!-- Bottom stats -->
  <rect x="150" y="345" width="120" height="35" fill="rgba(34,197,94,0.15)" rx="10" />
  <text x="210" y="368" fill="#4ade80" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">+200 membres</text>
  
  <rect x="290" y="345" width="120" height="35" fill="rgba(6,182,212,0.15)" rx="10" />
  <text x="350" y="368" fill="#22d3ee" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Ateliers hebdo</text>
  
  <rect x="430" y="345" width="120" height="35" fill="rgba(139,92,246,0.15)" rx="10" />
  <text x="490" y="368" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Projets réels</text>
</svg>

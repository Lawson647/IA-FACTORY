<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Construire son premier agent IA sans coder - schéma pédagogique">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#agentBg)" rx="24" />
  
  <!-- Titre -->
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">4 modules pour créer votre 1er agent</text>
  
  <!-- Module 1 -->
  <rect x="40" y="80" width="115" height="260" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.3)" stroke-width="2" rx="12" />
  <text x="97" y="110" fill="#a78bfa" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MODULE 1</text>
  <text x="97" y="140" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Découverte</text>
  <text x="60" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Quel agent ?</text>
  <text x="60" y="200" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Quelle tâche ?</text>
  <text x="60" y="220" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Brief agent</text>
  <circle cx="97" cy="310" r="25" fill="url(#agentGrad)" opacity="0.2" />
  <text x="97" y="318" fill="white" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🔍</text>
  
  <!-- Module 2 -->
  <rect x="170" y="80" width="115" height="260" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.3)" stroke-width="2" rx="12" />
  <text x="227" y="110" fill="#22d3ee" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MODULE 2</text>
  <text x="227" y="140" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Premier agent</text>
  <text x="190" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Outil no-code</text>
  <text x="190" y="200" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Prompt système</text>
  <text x="190" y="220" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Contexte</text>
  <circle cx="227" cy="310" r="25" fill="url(#agentGrad)" opacity="0.2" />
  <text x="227" y="318" fill="white" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🛠️</text>
  
  <!-- Module 3 -->
  <rect x="300" y="80" width="115" height="260" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.3)" stroke-width="2" rx="12" />
  <text x="357" y="110" fill="#4ade80" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MODULE 3</text>
  <text x="357" y="140" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Automatisation</text>
  <text x="320" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Idée → contenu</text>
  <text x="320" y="200" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Flux no-code</text>
  <text x="320" y="220" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Garde-fous</text>
  <circle cx="357" cy="310" r="25" fill="url(#agentGrad)" opacity="0.2" />
  <text x="357" y="318" fill="white" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">⚡</text>
  
  <!-- Module 4 -->
  <rect x="430" y="80" width="130" height="260" fill="rgba(255,255,255,0.04)" stroke="rgba(236,72,153,0.3)" stroke-width="2" rx="12" />
  <text x="495" y="110" fill="#ec4899" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">MODULE 4</text>
  <text x="495" y="140" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Déploiement</text>
  <text x="455" y="180" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Connexion outils</text>
  <text x="455" y="200" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Mise en ligne</text>
  <text x="455" y="220" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10">• Mesure & itération</text>
  <circle cx="495" cy="310" r="25" fill="url(#agentGrad)" opacity="0.2" />
  <text x="495" y="318" fill="white" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">🚀</text>
  
  <!-- Flèches -->
  <path d="M155 210 L170 210" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <polygon points="170,210 163,206 163,214" fill="rgba(255,255,255,0.2)" />
  <path d="M285 210 L300 210" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <polygon points="300,210 293,206 293,214" fill="rgba(255,255,255,0.2)" />
  <path d="M415 210 L430 210" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <polygon points="430,210 423,206 423,214" fill="rgba(255,255,255,0.2)" />
</svg>

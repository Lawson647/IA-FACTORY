<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="Les 4 offres IA Factory : Découverte, Builder, Pro, Entreprise">
  <defs>
    <linearGradient id="offerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#120d1f" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="320" fill="url(#offerBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Une offre qui grandit avec vous</text>
  
  <!-- Découverte -->
  <rect x="25" y="75" width="120" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
  <circle cx="85" cy="110" r="20" fill="rgba(255,255,255,0.1)" />
  <text x="85" y="117" fill="white" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">🔍</text>
  <text x="85" y="150" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Découverte</text>
  <text x="85" y="175" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Gratuit</text>
  <text x="85" y="210" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Newsletter</text>
  <text x="85" y="225" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Ressources</text>
  
  <!-- Builder -->
  <rect x="165" y="75" width="120" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
  <rect x="165" y="75" width="120" height="4" fill="url(#purpleGrad)" rx="2" />
  <circle cx="225" cy="110" r="20" fill="url(#purpleGrad)" opacity="0.3" />
  <text x="225" y="117" fill="#a78bfa" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">🛠️</text>
  <text x="225" y="150" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Builder</text>
  <text x="225" y="175" fill="#a78bfa" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">29€/mois</text>
  <text x="225" y="210" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Accès formations</text>
  <text x="225" y="225" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Communauté</text>
  
  <!-- Pro -->
  <rect x="305" y="75" width="120" height="200" fill="rgba(255,255,255,0.06)" stroke="url(#cyanGrad)" stroke-width="2" rx="16" />
  <rect x="305" y="75" width="120" height="4" fill="url(#cyanGrad)" rx="2" />
  <circle cx="365" cy="110" r="20" fill="url(#cyanGrad)" opacity="0.3" />
  <text x="365" y="117" fill="#22d3ee" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">⚡</text>
  <text x="365" y="150" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Pro</text>
  <text x="365" y="175" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">99€/mois</text>
  <text x="365" y="210" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Coaching agent</text>
  <text x="365" y="225" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Templates agents</text>
  <rect x="335" y="60" width="60" height="22" fill="url(#cyanGrad)" rx="11" />
  <text x="365" y="75" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">POPULAIRE</text>
  
  <!-- Entreprise -->
  <rect x="445" y="75" width="130" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
  <circle cx="510" cy="110" r="20" fill="rgba(236,72,153,0.3)" />
  <text x="510" y="117" fill="#ec4899" font-family="Inter, sans-serif" font-size="16" text-anchor="middle">🏢</text>
  <text x="510" y="150" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Entreprise</text>
  <text x="510" y="175" fill="#ec4899" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sur mesure</text>
  <text x="510" y="210" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Déploiement interne</text>
  <text x="510" y="225" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Formation équipe</text>
  
  <!-- Flèches de progression -->
  <path d="M145 175 L160 175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
  <path d="M285 175 L300 175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
  <path d="M425 175 L440 175" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
</svg>

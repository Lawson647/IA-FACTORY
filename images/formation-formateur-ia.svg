<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="De formateur à formateur IA - passer de l'expertise à l'offre">
  <defs>
    <linearGradient id="formBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#formBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">De formateur à formateur IA</text>
  <text x="300" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Transformez votre expertise IA en offre de formation vendable</text>
  
  <!-- Personne à gauche -->
  <circle cx="100" cy="200" r="50" fill="url(#formGrad)" opacity="0.2" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <text x="100" y="212" fill="white" font-family="Inter, sans-serif" font-size="36" text-anchor="middle">👤</text>
  <text x="100" y="280" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Expert IA</text>
  
  <!-- Flèche de transformation -->
  <path d="M160 200 L240 200" stroke="url(#formGrad)" stroke-width="4" stroke-linecap="round" />
  <polygon points="240,200 230,193 230,207" fill="url(#formGrad)" />
  <text x="200" y="185" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Positionnement</text>
  <text x="200" y="230" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Fiche offre</text>
  
  <!-- Offre au centre -->
  <rect x="260" y="130" width="180" height="140" fill="rgba(255,255,255,0.06)" stroke="url(#formGrad)" stroke-width="2" rx="16" />
  <text x="350" y="165" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">FORMATION IA</text>
  <rect x="290" y="185" width="120" height="8" fill="rgba(255,255,255,0.3)" rx="4" />
  <rect x="290" y="205" width="120" height="8" fill="rgba(255,255,255,0.2)" rx="4" />
  <rect x="290" y="225" width="80" height="8" fill="rgba(255,255,255,0.2)" rx="4" />
  <text x="350" y="260" fill="#22d3ee" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Offre prête à vendre</text>
  
  <!-- Flèche vers client -->
  <path d="M460 200 L540 200" stroke="url(#formGrad)" stroke-width="4" stroke-linecap="round" />
  <polygon points="540,200 530,193 530,207" fill="url(#formGrad)" />
  <text x="500" y="185" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">5 messages</text>
  <text x="500" y="230" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">1er client</text>
  
  <!-- Client à droite -->
  <circle cx="590" cy="200" r="50" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="2" />
  <text x="590" y="212" fill="#4ade80" font-family="Inter, sans-serif" font-size="36" text-anchor="middle">🎯</text>
  <text x="590" y="280" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Premier client</text>
  
  <!-- Bas -->
  <rect x="100" y="330" width="400" height="50" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12" />
  <text x="300" y="350" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">6h de formation — 1 journée ou 3 × 2h</text>
  <text x="300" y="370" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">3 modules : Positionnement → Ciblage → Premier client</text>
</svg>

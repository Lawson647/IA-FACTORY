<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Certification IA Factory - Processus d'évaluation en 3 étapes">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#certBg)" rx="24" />
  
  <text x="300" y="45" fill="white" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Certification IA Factory</text>
  <text x="300" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">3 étapes pour obtenir le label Formateur Agent IA</text>
  
  <!-- Étape 1: Dossier -->
  <rect x="50" y="110" width="150" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(139,92,246,0.4)" stroke-width="2" rx="16" />
  <rect x="80" y="140" width="90" height="110" fill="rgba(139,92,246,0.15)" rx="8" />
  <text x="125" y="170" fill="#a78bfa" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">📄</text>
  <rect x="95" y="190" width="60" height="6" fill="rgba(255,255,255,0.3)" rx="3" />
  <rect x="95" y="205" width="60" height="6" fill="rgba(255,255,255,0.2)" rx="3" />
  <rect x="95" y="220" width="40" height="6" fill="rgba(255,255,255,0.2)" rx="3" />
  <text x="125" y="280" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Dossier</text>
  <text x="125" y="300" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">pédagogique</text>
  
  <!-- Flèche -->
  <path d="M210 210 L240 210" stroke="url(#certGrad)" stroke-width="3" />
  <polygon points="240,210 232,206 232,214" fill="url(#certGrad)" />
  
  <!-- Étape 2: Live -->
  <rect x="250" y="110" width="150" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(6,182,212,0.4)" stroke-width="2" rx="16" />
  <circle cx="325" cy="180" r="35" fill="rgba(6,182,212,0.15)" />
  <text x="325" y="192" fill="#22d3ee" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">🎤</text>
  <text x="325" y="235" fill="white" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Jury IA Factory</text>
  <text x="325" y="280" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Démo live</text>
  <text x="325" y="300" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">20 minutes</text>
  
  <!-- Flèche -->
  <path d="M410 210 L440 210" stroke="url(#certGrad)" stroke-width="3" />
  <polygon points="440,210 432,206 432,214" fill="url(#certGrad)" />
  
  <!-- Étape 3: Badge -->
  <rect x="450" y="110" width="150" height="200" fill="rgba(255,255,255,0.04)" stroke="rgba(34,197,94,0.4)" stroke-width="2" rx="16" />
  <circle cx="525" cy="180" r="40" fill="url(#certGrad)" opacity="0.3" />
  <text x="525" y="175" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FORMATEUR</text>
  <text x="525" y="195" fill="white" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AGENT IA</text>
  <text x="525" y="280" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Label obtenu</text>
  <text x="525" y="300" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Déploiement interne</text>
  
  <!-- Bas -->
  <rect x="100" y="345" width="400" height="40" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1" rx="12" />
  <text x="300" y="370" fill="#4ade80" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">2 jours d'évaluation + accompagnement post-certification</text>
</svg>

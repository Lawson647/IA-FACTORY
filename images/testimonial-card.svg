<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Témoignage client IA Factory">
  <defs>
    <linearGradient id="testiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.15)" />
      <stop offset="100%" stop-color="rgba(6,182,212,0.1)" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="#0a0a0f" rx="20" />
  <rect x="20" y="20" width="360" height="260" fill="url(#testiBg)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="16" />
  
  <!-- Avatar -->
  <circle cx="70" cy="70" r="30" fill="url(#accentGrad)" />
  <text x="70" y="80" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="600" text-anchor="middle">M</text>
  
  <text x="115" y="65" fill="white" font-family="Inter, sans-serif" font-size="16" font-weight="600">Marie L.</text>
  <text x="115" y="85" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="12">Consultante marketing</text>
  
  <!-- Quote -->
  <text x="50" y="135" fill="#8b5cf6" font-family="Georgia, serif" font-size="36" font-style="italic">"</text>
  <text x="70" y="150" fill="white" font-family="Inter, sans-serif" font-size="15" font-weight="500">J'ai gagné 5h par semaine.</text>
  <text x="70" y="175" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="14">Mon agent LinkedIn publie mes posts</text>
  <text x="70" y="195" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="14">tout seul. C'est devenu indispensable.</text>
  
  <!-- Stats -->
  <rect x="50" y="225" width="90" height="45" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="95" y="248" fill="#22c55e" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">+5h</text>
  <text x="95" y="262" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">/semaine</text>
  
  <rect x="155" y="225" width="90" height="45" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="200" y="248" fill="#22d3ee" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">12</text>
  <text x="200" y="262" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">posts/mois</text>
  
  <rect x="260" y="225" width="100" height="45" fill="rgba(255,255,255,0.06)" rx="10" />
  <text x="310" y="248" fill="#a78bfa" font-family="Inter, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2 sem.</text>
  <text x="310" y="262" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">pour déployer</text>
</svg>

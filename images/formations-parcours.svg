<svg width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-label="Parcours de formations IA Factory pour chaque niveau">
  <defs>
    <linearGradient id="formBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="formGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <rect width="700" height="420" fill="url(#formBg)" rx="24" />
  
  <text x="350" y="45" fill="white" font-family="Inter, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Un parcours pour chaque niveau</text>
  <text x="350" y="70" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Découverte → Builder → Pro → Entreprise</text>
  
  <!-- Ligne de parcours -->
  <path d="M100 220 Q250 180 350 220 T600 220" fill="none" stroke="url(#formGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Niveau 1: Découverte -->
  <circle cx="100" cy="220" r="35" fill="url(#formGrad)" opacity="0.2" stroke="#a78bfa" stroke-width="2" />
  <text x="100" y="230" fill="#a78bfa" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">🔍</text>
  <text x="100" y="285" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Découverte</text>
  <text x="100" y="305" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Gratuit</text>
  <text x="100" y="325" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Ressources + newsletter</text>
  
  <!-- Niveau 2: Builder -->
  <circle cx="250" cy="220" r="35" fill="url(#formGrad)" opacity="0.3" stroke="#22d3ee" stroke-width="2" />
  <text x="250" y="230" fill="#22d3ee" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">🛠️</text>
  <text x="250" y="285" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Builder</text>
  <text x="250" y="305" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">29€/mois</text>
  <text x="250" y="325" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Accès formations + communauté</text>
  
  <!-- Niveau 3: Pro -->
  <circle cx="450" cy="220" r="40" fill="url(#formGrad)" opacity="0.4" stroke="url(#formGrad)" stroke-width="3" />
  <text x="450" y="232" fill="white" font-family="Inter, sans-serif" font-size="28" text-anchor="middle">⚡</text>
  <text x="450" y="285" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Pro</text>
  <text x="450" y="305" fill="#22d3ee" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">99€/mois</text>
  <text x="450" y="325" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Coaching agents + templates</text>
  
  <rect x="420" y="140" width="60" height="24" fill="url(#formGrad)" rx="12" />
  <text x="450" y="157" fill="white" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">POPULAIRE</text>
  
  <!-- Niveau 4: Entreprise -->
  <circle cx="600" cy="220" r="35" fill="url(#formGrad)" opacity="0.3" stroke="#ec4899" stroke-width="2" />
  <text x="600" y="230" fill="#ec4899" font-family="Inter, sans-serif" font-size="24" text-anchor="middle">🏢</text>
  <text x="600" y="285" fill="white" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Entreprise</text>
  <text x="600" y="305" fill="#ec4899" font-family="Inter, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sur mesure</text>
  <text x="600" y="325" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Déploiement + formation équipe</text>
  
  <!-- Badges -->
  <rect x="80" y="360" width="540" height="40" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12" />
  <text x="350" y="385" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Toutes les formations sont accessibles dès l'abonnement Builder</text>
</svg>
